spring.application.name=tournament
server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never

spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

security.jwt.secret=${JWT_SECRET:tournament-lab5-development-secret-change-me}
security.jwt.access-token-ttl=${JWT_ACCESS_TTL:15m}
security.jwt.refresh-token-ttl=${JWT_REFRESH_TTL:7d}
